name: daily-board

on:
  schedule:
    - cron: "40 18 * * *" # 00:10 IST — seed today's baseline
    - cron: "20 18 * * *" # 23:50 IST — post the daily board
  workflow_dispatch:

concurrency:
  group: leaderboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Daily board (seed or post, auto by IST hour)
        env:
          LEADERBOARD_WEBHOOK_URL: ${{ secrets.LEADERBOARD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python3 leaderboard.py daily
      - name: Commit state
        run: |
          git config user.name "mf-bot"
          git config user.email "bot@missionfaang.local"
          git add data/
          if git diff --cached --quiet; then echo "nothing to commit"; else git commit --quiet -m "daily board update" && GIT_EDITOR="true" git pull --rebase --autostash --quiet && git push --quiet; fi

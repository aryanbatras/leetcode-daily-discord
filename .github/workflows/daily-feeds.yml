name: Post daily feeds

on:
  schedule:
    # 00:50 UTC = 06:20 IST, after the daily problem at 06:00
    - cron: "50 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feeds

jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Post all daily feeds
        env:
          FEED_WEBHOOKS: ${{ secrets.FEED_WEBHOOKS }}
        run: python3 post_feeds.py
      - name: Commit feed state
        run: |
          git config user.name "mfgrind-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash
          git add data/topic_state.json data/cf_state.json
          git diff --cached --quiet || git commit -m "feed state $(date -u +%F)"
          git push

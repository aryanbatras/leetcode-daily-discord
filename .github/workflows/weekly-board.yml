name: Post weekly board

on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC = 08:00 IST daily
  workflow_dispatch:

concurrency:
  group: board

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot totals and post the board
        env:
          LEADERBOARD_WEBHOOK_URL: ${{ secrets.LEADERBOARD_WEBHOOK_URL }}
        run: python3 leaderboard.py board
      - name: Commit snapshots
        if: env.LEADERBOARD_WEBHOOK_URL != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.json
          git diff --cached --quiet || git commit -m "Daily snapshot [skip ci]"
          git push

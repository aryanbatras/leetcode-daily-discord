name: Daily Post
# re-register schedule trigger (file rename broke the cron registration)

on:
  schedule:
    - cron: "45 0 * * *" # 00:45 UTC = 06:15 IST daily (avoid peak hour traffic)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Poll registrations
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python3 -u leaderboard.py poll
      - name: Post daily problem
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python3 post_daily.py
      - name: Post upcoming contests
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          FEED_WEBHOOKS: ${{ secrets.FEED_WEBHOOKS }}
        run: python3 -u scripts/build_catalog.py contests
      - name: Post leaderboard
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          LEADERBOARD_WEBHOOK_URL: ${{ secrets.LEADERBOARD_WEBHOOK_URL }}
        run: python3 -u leaderboard.py board
      - name: Scan availability
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python3 -u availability.py scan
      - name: Post availability chart
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python3 -u availability.py chart
      - name: Commit state
        run: |
          git config user.name "mf-bot"
          git config user.email "bot@missionfaang.local"
          git add data/members.json data/snapshots.json data/availability.json
          if git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "daily update [skip ci]" && git push; fi

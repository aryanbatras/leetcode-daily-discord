name: Daily Post

on:
  schedule:
    - cron: "30 0 * * *" # 00:30 UTC = 06:00 IST daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post daily problem
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python3 post_daily.py
      - name: Post upcoming contests
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          FEED_WEBHOOKS: ${{ secrets.FEED_WEBHOOKS }}
        run: python3 -u scripts/build_catalog.py contests
      - name: Poll registrations
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python3 leaderboard.py poll
      - name: Post leaderboard
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          LEADERBOARD_WEBHOOK_URL: ${{ secrets.LEADERBOARD_WEBHOOK_URL }}
        run: python3 leaderboard.py board

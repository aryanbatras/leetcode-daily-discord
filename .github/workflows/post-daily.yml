name: Post LeetCode Daily

on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC = 08:00 IST daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post today's problem to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 post_daily.py

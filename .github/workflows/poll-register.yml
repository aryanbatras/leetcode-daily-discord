name: Poll Registrations

on:
  schedule:
    - cron: "0 * * * *"  # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Poll #register for new usernames
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python3 -u leaderboard.py poll
      - name: Commit member updates
        run: |
          git config user.name "mf-bot"
          git config user.email "bot@missionfaang.local"
          git add data/members.json
          if git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "members update [skip ci]" && git push; fi
